<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Meow</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background-color: #fff;
      overflow: hidden;
    }

    .container {
      text-align: center;
    }

    img {
      max-width: 250px;
      height: auto;
      display: block;
      margin: 0 auto 20px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
      font-weight: normal;
    }

    button {
      font-size: 16px;
      padding: 10px 20px;
      margin: 0 10px;
      cursor: pointer;
    }

    #pinkBtn {
      color: hotpink;
    }

    /* Love screen */
    .love-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      text-align: center;
    }

    .love-screen h1 {
      font-size: 48px;
      color: #ff4d6d;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="container" id="mainScreen">
    <img src="hhttps://media1.tenor.com/m/o_5RQarGvJ0AAAAC/kiss.gif" alt="gif">
    <h1>will you be my valentine</h1>
    <div>
      <button id="yesBtn">yes</button>
      <button id="pinkBtn">Yes, but in pink</button>
    </div>
  </div>

  <div class="love-screen" id="loveScreen">
    <h1>I love you &lt;3</h1>
    <canvas id="confetti"></canvas>
  </div>

  <script>
    const yesBtn = document.getElementById("yesBtn");
    const pinkBtn = document.getElementById("pinkBtn");
    const mainScreen = document.getElementById("mainScreen");
    const loveScreen = document.getElementById("loveScreen");

    function goToLove() {
      mainScreen.style.display = "none";
      loveScreen.style.display = "flex";
      startConfetti();
    }

    yesBtn.addEventListener("click", goToLove);
    pinkBtn.addEventListener("click", goToLove);

    /* Confetti */
    function startConfetti() {
      const canvas = document.getElementById("confetti");
      const ctx = canvas.getContext("2d");

      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const confetti = Array.from({ length: 150 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height - canvas.height,
        size: Math.random() * 6 + 4,
        speed: Math.random() * 3 + 2,
        color: `hsl(${Math.random() * 360}, 100%, 70%)`
      }));

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        confetti.forEach(c => {
          c.y += c.speed;
          if (c.y > canvas.height) c.y = -10;
          ctx.fillStyle = c.color;
          ctx.fillRect(c.x, c.y, c.size, c.size);
        });
        requestAnimationFrame(animate);
      }

      animate();
    }
  </script>

</body>
</html>
